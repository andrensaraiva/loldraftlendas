name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, tests, and historical data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate historical data
        run: npm run data:multi:validate

      - name: Validate historical readiness inventory
        run: npm run data:readiness:validate

      - name: Validate public archive index
        run: npm run data:archive:validate

      - name: Validate player portrait assets
        run: python scripts/validate_player_portraits.py

      - name: Production build
        run: npm run build

      - name: Audit beta build budgets and PWA files
        run: npm run audit:beta

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
